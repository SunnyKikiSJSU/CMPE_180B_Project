          type: string
        avatarUrl:
          type: string
          nullable: true
    Review:
      type: object
      required: [id, bookId, userId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        body:
          type: string
        title:
          type: string
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true

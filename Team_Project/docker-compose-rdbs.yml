services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: rds
      PORT: 8080
      DB_HOST: ${RDS_HOST:?Set RDS_HOST in .env}
      DB_PORT: ${RDS_PORT:-5432}
      DB_NAME: ${RDS_DB:?Set RDS_DB in .env}
      DB_USER: ${RDS_USER:?Set RDS_USER in .env}
      DB_PASSWORD: ${RDS_PASSWORD:?Set RDS_PASSWORD in .env}
      DB_SSLMODE: ${RDS_SSLMODE:-require}
      # Optional: read the database credentials from the Terraform Secrets
      # Manager secret with the instance role instead of the DB_* values.
      DB_SECRET_ARN: ${DB_SECRET_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      # Required: the API refuses example values outside APP_ENV=local.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENLIBRARY_USER_AGENT: ${OPENLIBRARY_USER_AGENT:-}
      OPENLIBRARY_URL: ${OPENLIBRARY_URL:-https://openlibrary.org}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - book_net

  # Next.js web tier: the only service the browser talks to. It serves the
  # pages and forwards /api/* to the api container over the Compose network,
  # so the session cookie stays on one origin (no CORS).
  web:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8080
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - book_net

  # HTTPS on EC2: `docker compose --profile https up -d proxy`. Caddy listens
  # on 80 and 443, gets a Let's Encrypt certificate for SITE_ADDRESS, and
  # forwards to web. Set COOKIE_SECURE=true in .env when it runs.
  proxy:
    image: caddy:2.11.9-alpine
    profiles:
      - https
    restart: unless-stopped
    environment:
      # Required for this service (for example 3-136-227-184.sslip.io).
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - book_net

  postgres-client:
    image: postgres:18-alpine
    profiles:
      - client
    stdin_open: true
    tty: true
    environment:
      PGHOST: ${RDS_HOST:?Set RDS_HOST in .env}
      PGPORT: ${RDS_PORT:-5432}
      PGDATABASE: ${RDS_DB:?Set RDS_DB in .env}
      PGUSER: ${RDS_USER:?Set RDS_USER in .env}
      PGPASSWORD: ${RDS_PASSWORD:?Set RDS_PASSWORD in .env}
      PGSSLMODE: ${RDS_SSLMODE:-require}
    entrypoint:
      - psql
    networks:
      - book_net

  migrate:
    image: migrate/migrate:v4.18.3
    profiles:
      - tools
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${RDS_DATABASE_URL:-}"
      - "up"
    networks:
      - book_net

  seed:
    image: postgres:18-alpine
    profiles:
      - tools
    environment:
      PGHOST: ${RDS_HOST:?Set RDS_HOST in .env}
      PGPORT: ${RDS_PORT:-5432}
      PGDATABASE: ${RDS_DB:?Set RDS_DB in .env}
      PGUSER: ${RDS_USER:?Set RDS_USER in .env}
      PGPASSWORD: ${RDS_PASSWORD:?Set RDS_PASSWORD in .env}
      PGSSLMODE: ${RDS_SSLMODE:-require}
    volumes:
      - ./database/seeds:/seeds:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        found=0
        for file in /seeds/*.sql; do
          if [ ! -f "$$file" ]; then
            continue
          fi
          found=1
          echo "Applying seed file: $$file"
          psql -v ON_ERROR_STOP=1 -P pager=off --file "$$file"
        done
        if [ "$$found" -eq 0 ]; then
          echo "No seed files found in /seeds"
        fi
    networks:
      - book_net

volumes:
  # Caddy's certificates and ACME account; keep them so restarts do not
  # request new certificates (Let's Encrypt rate limits).
  caddy_data:
  caddy_config:

networks:
  book_net:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: # These environment variables are used by the official PostgreSQL Docker image to automatically create the database and user.
      POSTGRES_DB: ${POSTGRES_DB:-book_metaverse}
      POSTGRES_USER: ${POSTGRES_USER:-book_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - book_net

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-book_metaverse}
      DB_USER: ${POSTGRES_USER:-book_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_COUNTRY: ${GOOGLE_BOOKS_COUNTRY:-US}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - book_net

  migrate:
    image: migrate/migrate:v4.18.3
    profiles:
      - tools # A service with a profile does not start during a plain, X docker compose up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    command: # up: apply pending migration, or print no change if applied
      - "-path=/migrations"
      - "-database=${MIGRATE_DATABASE_URL:-${DATABASE_URL:-}}"
      - "up"
    networks:
      - book_net

  seed:
    image: postgres:18-alpine
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-book_metaverse}
      PGUSER: ${POSTGRES_USER:-book_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/seeds:/seeds:ro
    entrypoint:
      - /bin/sh
      - -c
    # psql uses the standard PostgreSQL environment variables when no explicit
    # host, port, username, or database option is supplied.
    command:
      - |
        set -eu
        found=0
        for file in /seeds/*.sql; do
          if [ ! -f "$$file" ]; then
            continue
          fi
          found=1
          echo "Applying seed file: $$file"
          psql -v ON_ERROR_STOP=1 --file "$$file"
        done
        if [ "$$found" -eq 0 ]; then
          echo "No seed files found in /seeds"
        fi
    networks:
      - book_net

  # Generates backend/internal/db from database/queries and
  # database/schema/schema.sql. It needs no database, so it is a one-off
  # "tools" service instead of a long-running container.
  sqlc:
    # Pinned for reproducible generated code. Update deliberately and review
    # the generated diff before committing a newer version.
    image: sqlc/sqlc:1.27.0
    profiles:
      - tools
    working_dir: /src/backend
    volumes:
      # Mount only what sqlc reads. Generated output is written back into the
      # bind-mounted backend/internal/db directory.
      - ./backend:/src/backend
      - ./database:/src/database:ro
    command:
      - generate
    networks:
      - book_net

volumes:
  postgres_data:

networks:
  book_net:
    driver: bridge
